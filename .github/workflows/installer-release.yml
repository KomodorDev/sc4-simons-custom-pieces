name: Installer release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: installer-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Installer source checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Select Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install the complete test dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Run every source test suite
        run: python -B tools/run_tests.py

  build:
    name: Installer (${{ matrix.platform }})
    needs: tests
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - &windows_git
        name: Prepare long paths and exact source bytes on Windows
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Check out the exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - &windows_python
        name: Select Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: custom-pieces/requirements-installer.txt
      - &windows_dependencies
        name: Install pinned installer dependencies
        run: python -m pip install -r custom-pieces/requirements-installer.txt
      - &source_dependencies
        name: Install developer-only source and release-policy dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Freeze, self-test, and verify the native installer ZIP
        shell: bash
        env:
          INSTALLER_PLATFORM: ${{ matrix.platform }}
          INSTALLER_COMMIT: ${{ github.sha }}
        run: >-
          python -B custom-pieces/installer/build_bundle.py build
          --output "$RUNNER_TEMP/scp-installer"
          --source-commit "$INSTALLER_COMMIT"
          --platform "$INSTALLER_PLATFORM"
      - name: Prepare synthetic finished files for the compact player check
        shell: bash
        run: >-
          python -B custom-pieces/installer/prepare_fixture.py
          --output "$RUNNER_TEMP/scp-player-fixture" --source-commit "$GITHUB_SHA"
      - name: Freeze and extract the compact player fixture under Windows Downloads
        shell: bash
        run: >-
          python -B custom-pieces/installer/build_bundle.py build
          --output "$RUNNER_TEMP/scp-player-installer" --source-commit "$GITHUB_SHA" --platform windows-x64
          --prebuilt-payload "$RUNNER_TEMP/scp-player-fixture"
      - name: Keep compact player fixture verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compact-player-fixture-checks
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/scp-player-installer/archive-check-*.json
            ${{ runner.temp }}/scp-player-installer/extraction-check-*.json
            ${{ runner.temp }}/scp-player-installer/self-test-*.json
            ${{ runner.temp }}/scp-player-installer/gui-smoke-test-*.json
      - name: Keep verified installer and review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/scp-installer/*.zip
            ${{ runner.temp }}/scp-installer/*.zip.sha256
            ${{ runner.temp }}/scp-installer/bundle-index-*.json
            ${{ runner.temp }}/scp-installer/archive-check-*.json
            ${{ runner.temp }}/scp-installer/self-test-*.json
            ${{ runner.temp }}/scp-installer/gui-smoke-test-*.json
            ${{ runner.temp }}/scp-installer/extraction-check-*.json

  review:
    name: Private hosted prebuilt review
    needs: tests
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: windows-2022
    timeout-minutes: 45
    environment: scp-prebuilt-review
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - *windows_git
      - &release_checkout
        name: Check out the exact revision and its source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - *windows_python
      - *windows_dependencies
      - name: Verify Dropbox handoff and rejected inputs
        shell: bash
        env:
          SCP_DROPBOX_APP_KEY: ${{ secrets.SCP_DROPBOX_APP_KEY }}
          SCP_DROPBOX_REFRESH_TOKEN: ${{ secrets.SCP_DROPBOX_REFRESH_TOKEN }}
        run: >-
          python -B custom-pieces/installer/release_handoff.py
          --mode review --workspace "$RUNNER_TEMP/scp-handoff"
      - name: Build and test the private Windows installer
        shell: bash
        run: >-
          python -B custom-pieces/installer/build_bundle.py build
          --output "$RUNNER_TEMP/scp-installer" --source-commit "$GITHUB_SHA" --platform windows-x64
          --prebuilt-payload "$RUNNER_TEMP/scp-handoff/payload"
          --release-record "$RUNNER_TEMP/scp-handoff/release-record.json"
      - name: Keep compact packaging and Downloads extraction review reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prebuilt-installer-review-checks
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/scp-installer/archive-check-*.json
            ${{ runner.temp }}/scp-installer/extraction-check-*.json
            ${{ runner.temp }}/scp-installer/self-test-*.json
            ${{ runner.temp }}/scp-installer/gui-smoke-test-*.json
      # The repository is public. The private review ZIP never leaves this runner.

  publish:
    name: Publish verified prebuilt Windows installer
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    environment: scp-prebuilt-release
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - *windows_git
      - *release_checkout
      - *windows_python
      - *windows_dependencies
      - *source_dependencies
      - name: Check the approved merge and download its verified prebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCP_DROPBOX_APP_KEY: ${{ secrets.SCP_DROPBOX_APP_KEY }}
          SCP_DROPBOX_REFRESH_TOKEN: ${{ secrets.SCP_DROPBOX_REFRESH_TOKEN }}
          SCP_PREBUILT_PUBLICATION: ${{ vars.SCP_PREBUILT_PUBLICATION }}
          SCP_PREBUILT_REVIEW_RUN_ID: ${{ vars.SCP_PREBUILT_REVIEW_RUN_ID }}
        run: >-
          python -B custom-pieces/installer/release_handoff.py
          --mode publish --workspace "$RUNNER_TEMP/scp-handoff"
      - name: Build and test the release Windows installer
        shell: bash
        env:
          SCP_PREBUILT_PUBLICATION: ${{ vars.SCP_PREBUILT_PUBLICATION }}
        run: >-
          python -B custom-pieces/installer/build_bundle.py build
          --output "$RUNNER_TEMP/scp-installer" --source-commit "$GITHUB_SHA" --platform windows-x64
          --prebuilt-payload "$RUNNER_TEMP/scp-handoff/payload"
          --release-record "$RUNNER_TEMP/scp-handoff/release-record.json" --public-prebuilt
      - name: Verify and publish this exact main commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SCP_PREBUILT_PUBLICATION: ${{ vars.SCP_PREBUILT_PUBLICATION }}
          SCP_PREBUILT_REVIEW_RUN_ID: ${{ vars.SCP_PREBUILT_REVIEW_RUN_ID }}
        run: >-
          python -B custom-pieces/installer/build_bundle.py publish
          --artifacts "$RUNNER_TEMP/scp-installer"
          --source-commit "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY" --prebuilt-release
